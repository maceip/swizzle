<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 560" width="880" height="560" fill="none">
  <defs>
    <!-- Main Orange-to-Red Diagonal Gradient -->
    <linearGradient id="swizzle-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff9e00" />
      <stop offset="50%" stop-color="#ec5215" />
      <stop offset="100%" stop-color="#d90429" />
    </linearGradient>

    <!-- Tier 1 Border Gradient -->
    <linearGradient id="tier1-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff9e00" />
      <stop offset="100%" stop-color="#f77f00" />
    </linearGradient>

    <!-- Tier 2 Border Gradient -->
    <linearGradient id="tier2-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f46d08" />
      <stop offset="100%" stop-color="#e3361c" />
    </linearGradient>

    <!-- Tier 3 Border Gradient -->
    <linearGradient id="tier3-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#df2920" />
      <stop offset="100%" stop-color="#d90429" />
    </linearGradient>

    <!-- Subtle Card Surface Gradient -->
    <linearGradient id="card-bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#161b22" />
      <stop offset="100%" stop-color="#0d1117" />
    </linearGradient>

    <!-- Arrow Markers -->
    <marker id="arrow-orange" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 1 2 L 8 5 L 1 8 z" fill="#f77f00" />
    </marker>
    <marker id="arrow-mid" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 1 2 L 8 5 L 1 8 z" fill="#e63e19" />
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 1 2 L 8 5 L 1 8 z" fill="#d90429" />
    </marker>
  </defs>

  <!-- Canvas Background -->
  <rect width="880" height="560" rx="14" fill="#0b0e14" stroke="#21262d" stroke-width="1" />

  <!-- ========================================================================= -->
  <!-- TIER 1: COHORT BUILDER                                                    -->
  <!-- ========================================================================= -->
  <rect x="32" y="24" width="816" height="106" rx="10" fill="url(#card-bg)" stroke="url(#tier1-grad)" stroke-width="1.5" />
  <text x="52" y="48" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" font-weight="700" fill="#ff9e00" letter-spacing="1">TIER 1 · COHORT BUILDER</text>
  <text x="828" y="48" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" fill="#8b949e">cadence: 1–6h</text>

  <!-- Node 1.1 -->
  <rect x="52" y="62" width="168" height="50" rx="6" fill="#1c2128" stroke="#30363d" stroke-width="1" />
  <text x="136" y="84" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#f0f6fc">Kernel Source</text>
  <text x="136" y="101" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" fill="#8b949e">vmlinux + UAPI</text>

  <line x1="220" y1="87" x2="250" y2="87" stroke="#f77f00" stroke-width="1.5" marker-end="url(#arrow-orange)" />

  <!-- Node 1.2 -->
  <rect x="256" y="62" width="248" height="50" rx="6" fill="#1c2128" stroke="#30363d" stroke-width="1" />
  <text x="380" y="84" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#f0f6fc">RANDSTRUCT + RegAlloc Jitter</text>
  <text x="380" y="101" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" fill="#ffb703">Seed_C · 64B cacheline bounds</text>

  <line x1="504" y1="87" x2="534" y2="87" stroke="#f77f00" stroke-width="1.5" marker-end="url(#arrow-orange)" />

  <!-- Node 1.3 -->
  <rect x="540" y="62" width="288" height="50" rx="6" fill="#1c2128" stroke="#30363d" stroke-width="1" />
  <text x="684" y="84" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#f0f6fc">Superset Thin Archive</text>
  <text x="684" y="101" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" fill="#8b949e">vmlinux-superset.a + pinned eBPF</text>

  <!-- Connector Tier 1 -> Tier 2 -->
  <line x1="440" y1="130" x2="440" y2="154" stroke="#f46d08" stroke-width="1.75" marker-end="url(#arrow-orange)" />

  <!-- ========================================================================= -->
  <!-- TIER 2: PROFILE LINKER & UKI SEALER                                       -->
  <!-- ========================================================================= -->
  <rect x="32" y="160" width="816" height="106" rx="10" fill="url(#card-bg)" stroke="url(#tier2-grad)" stroke-width="1.5" />
  <text x="52" y="184" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" font-weight="700" fill="#f46d08" letter-spacing="1">TIER 2 · PROFILE LINKER &amp; UKI SEALER</text>
  <text x="828" y="184" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" fill="#8b949e">per hardware profile</text>

  <!-- Node 2.1 -->
  <rect x="52" y="198" width="232" height="50" rx="6" fill="#1c2128" stroke="#30363d" stroke-width="1" />
  <text x="168" y="220" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#f0f6fc">Profile Slicer + Cohort BTF</text>
  <text x="168" y="237" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" fill="#8b949e">ld.lld --gc-sections · pahole -J</text>

  <line x1="284" y1="223" x2="314" y2="223" stroke="#e63e19" stroke-width="1.5" marker-end="url(#arrow-mid)" />

  <!-- Node 2.2 -->
  <rect x="320" y="198" width="232" height="50" rx="6" fill="#1c2128" stroke="#30363d" stroke-width="1" />
  <text x="436" y="220" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#f0f6fc">Pack SHT_RELA Relocations</text>
  <text x="436" y="237" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" fill="#f46d08">.init.swizzle_relocs (SWZL)</text>

  <line x1="552" y1="223" x2="582" y2="223" stroke="#e63e19" stroke-width="1.5" marker-end="url(#arrow-mid)" />

  <!-- Node 2.3 -->
  <rect x="588" y="198" width="240" height="50" rx="6" fill="#1c2128" stroke="#30363d" stroke-width="1" />
  <text x="708" y="220" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#f0f6fc">Signed Cohort UKI</text>
  <text x="708" y="237" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" fill="#8b949e">SEV-SNP ID_BLOCK · TDX · pcrlock</text>

  <!-- Connector Tier 2 -> Tier 3 -->
  <line x1="440" y1="266" x2="440" y2="290" stroke="#e3361c" stroke-width="1.75" marker-end="url(#arrow-mid)" />

  <!-- ========================================================================= -->
  <!-- TIER 3: IN-ENCLAVE EARLY-BOOT SELF-RELINKER                               -->
  <!-- ========================================================================= -->
  <rect x="32" y="296" width="816" height="106" rx="10" fill="url(#card-bg)" stroke="url(#tier3-grad)" stroke-width="1.5" />
  <text x="52" y="320" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" font-weight="700" fill="#ea2b1f" letter-spacing="1">TIER 3 · IN-ENCLAVE EARLY-BOOT SELF-RELINKER</text>
  <text x="828" y="320" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" fill="#8b949e">every boot · ~45ms</text>

  <!-- Node 3.1 -->
  <rect x="52" y="334" width="174" height="50" rx="6" fill="#1c2128" stroke="#30363d" stroke-width="1" />
  <text x="139" y="356" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#f0f6fc">Hardware Measure</text>
  <text x="139" y="373" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" fill="#8b949e">PCR[4] · RTMR[1] · SNP</text>

  <line x1="226" y1="359" x2="248" y2="359" stroke="#d90429" stroke-width="1.5" marker-end="url(#arrow-red)" />

  <!-- Node 3.2 -->
  <rect x="254" y="334" width="188" height="50" rx="6" fill="#1c2128" stroke="#30363d" stroke-width="1" />
  <text x="348" y="356" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#f0f6fc">RDSEED Permutation</text>
  <text x="348" y="373" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" fill="#f94144">.text* · .data* · .rodata*</text>

  <line x1="442" y1="359" x2="464" y2="359" stroke="#d90429" stroke-width="1.5" marker-end="url(#arrow-red)" />

  <!-- Node 3.3 -->
  <rect x="470" y="334" width="174" height="50" rx="6" fill="#1c2128" stroke="#30363d" stroke-width="1" />
  <text x="557" y="356" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#f0f6fc">In-Place Heapsort</text>
  <text x="557" y="373" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" fill="#8b949e">ex_table · ORC · kallsyms</text>

  <line x1="644" y1="359" x2="666" y2="359" stroke="#d90429" stroke-width="1.5" marker-end="url(#arrow-red)" />

  <!-- Node 3.4 -->
  <rect x="672" y="334" width="156" height="50" rx="6" fill="#1c2128" stroke="#30363d" stroke-width="1" />
  <text x="750" y="356" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#f0f6fc">HPKE Seal &amp; Scrub</text>
  <text x="750" y="373" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" fill="#f94144">RFC 9180 · memzero</text>

  <!-- Connectors Tier 3 -> Bottom Boxes -->
  <line x1="230" y1="402" x2="230" y2="428" stroke="#d90429" stroke-width="1.75" marker-end="url(#arrow-red)" />
  <line x1="650" y1="402" x2="650" y2="428" stroke="#d90429" stroke-width="1.75" stroke-dasharray="4 3" marker-end="url(#arrow-red)" />

  <!-- ========================================================================= -->
  <!-- BOTTOM LEFT: HARDENED TARGET NODE / CVM                                   -->
  <!-- ========================================================================= -->
  <rect x="32" y="434" width="396" height="102" rx="10" fill="url(#card-bg)" stroke="#d90429" stroke-width="1.5" />
  <text x="52" y="458" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" font-weight="700" fill="#f94144" letter-spacing="1">HARDENED RUNTIME · TARGET CVM / NODE</text>

  <circle cx="58" cy="480" r="3" fill="#ff9e00" />
  <text x="70" y="484" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#c9d1d9">Address-redacted <tspan fill="#f0f6fc">%pS</tspan> (<tspan fill="#8b949e">func+0xoff/0xsize</tspan>)</text>

  <circle cx="58" cy="500" r="3" fill="#f46d08" />
  <text x="70" y="504" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#c9d1d9">Per-boot slab freelist jitter &amp; <tspan fill="#f0f6fc">kmalloc</tspan> isolation</text>

  <circle cx="58" cy="520" r="3" fill="#d90429" />
  <text x="70" y="524" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#c9d1d9">Intact eBPF CO-RE (<tspan fill="#f0f6fc">.BTF</tspan>) &amp; CRIU VDSO offsets</text>

  <!-- ========================================================================= -->
  <!-- BOTTOM RIGHT: SYMBOL & ATTESTATION VAULT                                  -->
  <!-- ========================================================================= -->
  <rect x="452" y="434" width="396" height="102" rx="10" fill="url(#card-bg)" stroke="#d90429" stroke-width="1.5" />
  <text x="472" y="458" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" font-weight="700" fill="#f94144" letter-spacing="1">ZERO-STORAGE FORENSICS · SYMBOL VAULT</text>

  <circle cx="478" cy="480" r="3" fill="#ff9e00" />
  <text x="490" y="484" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#c9d1d9">Signer-delegated root verification (<tspan fill="#8b949e">SNP / TDX</tspan>)</text>

  <circle cx="478" cy="500" r="3" fill="#f46d08" />
  <text x="490" y="504" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#c9d1d9">Unseals panic <tspan fill="#f0f6fc">hpke:v1:&lt;enc&gt;:&lt;ct&gt;</tspan> envelope</text>

  <circle cx="478" cy="520" r="3" fill="#d90429" />
  <text x="490" y="524" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#c9d1d9">Replays <tspan fill="#f0f6fc">Seed_B</tspan> &#8594; exact GDB map (zero stored binaries)</text>
</svg>
